<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon (1).ico" type="image/x-icon">
    <!--라이브러리 파일-->
    <script src="js/jquery-3.7.1.min.js"></script>  <!--js는 불러오는순서도 중요함 -->
    <script src="js/swiper-bundle.min.js"></script>
    <link rel="stylesheet" href="css/swiper-bundle.min.css">
    <!--내파일-->
    <script src=""></script>
    <link rel="stylesheet" href="css/main.css">
    <script src="js/main.js"></script>
    <title>유기동물보호소</title>
</head>
<body>
    <div id="wrap">
        <header></header>
        <main class="container">
            <section class="visual">
                <h2 class="blind">팝업</h2>
                <div class="swiper"> <!-- 팝업의 높이와 넓이를 css에서 줄 수 있는 요소-->
                    <ul class="swiper-wrapper"> <!-- 각 팝업 콘텐츠를 감싸는 요소-->
                        <li class="swiper-slide pop1">
                            <div class="wrapper">
                                <p>작은 손길 하나가,<br>     
                                    한 생명을 살아 숨 쉬게 합니다. </p>
                            </div>
                        </li> 
                        <li class="swiper-slide pop2">
                            <div class="wrapper">
                                <p>기다림이 머문 눈빛, <br>  
                                    그 끝을 미소로 잇습니다</p>
                            </div>
                        </li>  
                        <li class="swiper-slide pop3">
                            <div class="wrapper">
                                <p>기다림의 끝엔,  <br>
                                    언제나 웃음이 있었습니다</p>
                            </div>
                        </li> 
                    </ul>
                </div><!--스위퍼 종료-->

                <div class="ctrl_btn">
                        <div class="paging">
                            <div class="current">현재팝업번호</div>
                            <div class="bar"><span></span></div>
                            <div class="total">전체팝업번호</div>
                        </div>
                        <button class="stop">
                            <span class="blind">일시정지</span>
                            <i>
                                <svg viewBox="0 0 9 11" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M7.33333 10.4587C6.94375 10.4587 6.61024 10.3199 6.33281 10.0425C6.05538 9.76508 5.91667 9.43158 5.91667 9.04199V1.95866C5.91667 1.56908 6.05538 1.23557 6.33281 0.958138C6.61024 0.680707 6.94375 0.541992 7.33333 0.541992C7.72292 0.541992 8.05642 0.680707 8.33385 0.958138C8.61128 1.23557 8.75 1.56908 8.75 1.95866V9.04199C8.75 9.43158 8.61128 9.76508 8.33385 10.0425C8.05642 10.3199 7.72292 10.4587 7.33333 10.4587ZM1.66667 10.4587C1.27708 10.4587 0.943576 10.3199 0.666146 10.0425C0.388715 9.76508 0.25 9.43158 0.25 9.04199V1.95866C0.25 1.56908 0.388715 1.23557 0.666146 0.958138C0.943576 0.680707 1.27708 0.541992 1.66667 0.541992C2.05625 0.541992 2.38976 0.680707 2.66719 0.958138C2.94462 1.23557 3.08333 1.56908 3.08333 1.95866V9.04199C3.08333 9.43158 2.94462 9.76508 2.66719 10.0425C2.38976 10.3199 2.05625 10.4587 1.66667 10.4587Z" fill="white"/>
                                </svg>
                                    
                            </i>
                        </button>
                        <button class="play">
                            <span class="blind">재생</span>
                            <i>
                                <svg viewBox="0 0 5 9" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M0.5 8.6C0.366667 8.6 0.25 8.55417 0.15 8.4625C0.05 8.37083 0 8.25 0 8.1V0.5C0 0.35 0.05 0.229167 0.15 0.1375C0.25 0.0458333 0.366667 0 0.5 0C0.533333 0 0.65 0.05 0.85 0.15L4.475 3.775C4.55833 3.85833 4.61667 3.94167 4.65 4.025C4.68333 4.10833 4.7 4.2 4.7 4.3C4.7 4.4 4.68333 4.49167 4.65 4.575C4.61667 4.65833 4.55833 4.74167 4.475 4.825L0.85 8.45C0.8 8.5 0.745833 8.5375 0.6875 8.5625C0.629167 8.5875 0.566667 8.6 0.5 8.6Z" fill="white"/>
                                </svg>
                                    
                            </i>
                        </button>
                </div>
                
            </section><!--visual-->
            <section class="visual"></section>
            <section class="find"></section>
            <section class="slogan"></section>
            <section class="adopt"></section>
            <section class="review"></section>







        </main>
           
    <footer></footer>

</body>
</html>
