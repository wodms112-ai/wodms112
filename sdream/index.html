<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--외부라이브러리 파일은 상단-->
    <script src="js/jquery-3.7.1.min.js"></script>
    <script src="js/swiper-bundle.min.js"></script>
    <link rel="stylesheet" href="css/swiper-bundle.min.css">
    <!--내가 직접 코딩한 파일은 하단-->
    <script src="js/main.js"></script>
    <link rel="shortcut icon" href="favicon_ico_96x96.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/main.css">
    <title>삼성꿈장학재단</title>
</head>
<body>
    <div class="wh"></div>
   <div id="wrap">
    <header>

    </header>
    <main class="container">
        <section class="visual">
            <h2 class="blind">팝업</h2>
            <div class="swiper"><!-- 팝업의 높이와 넓이를 css에서 줄 수 있는 요소-->
                <ul class="swiper-wrapper"><!-- 각 팝업 콘텐츠를 감싸는 요소-->
                    <li class="swiper-slide popup1"><!-- 한칸뛰고 클래스명 한개 더주기-->
                        <div class="wrapper">
                            <h3>배움의 기회가 <br class="mo_only"> 희망이 되도록, <br> <br class="mo_only">
                                삼성문화재단이 <br class="mo_only"> 함께합니다</h3>
                            <p>교육 기회와 따뜻한 돌봄으로 아이들의 성장을 함께합니다</p>
                        </div>
                    </li>
                    <li class="swiper-slide popup2"><!-- 한칸뛰고 클래스명 한개 더주기-->
                        <div class="wrapper">
                            <h3>오늘을 지키고, <br>
                                내일의 꿈을 키웁니다</h3>
                            <p>아이들의 재능과 가능성을 키우는 체계적인 장학 프로그램을 지원합니다</p>
                        </div>
                    </li>
                    <li class="swiper-slide popup3"><!-- 한칸뛰고 클래스명 한개 더주기-->
                        <div class="wrapper">
                            <h3>사람을 통해 사람을 키우는 교육, <br> 
                                더불어 성장하는 배움 공동체</h3>
                            <p>멘토와 배움터, 그리고 나눔으로 이어가는 배움 공동체를 지원합니다</p>
                        </div>
                    </li>

                </ul>

            </div><!--swiper-->
        </section><!--visual-->
        <section class="biz">

        </section><!--biz-->

        <section class="notice">

        </section><!--notice-->

        <section class="webzine">

        </section><!--webzine-->

        <section class="service">

        </section><!--service-->
    </main>

    <footer></footer>
   </div>
</body>
</html>
